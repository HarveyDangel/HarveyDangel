<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad">
      <stop offset="0%" stop-color="#ff5f6d">
        <animate attributeName="stop-color" dur="6s" values="#ff5f6d;#ffc371;#24c6dc;#9b5cff;#ff5f6d" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffc371">
        <animate attributeName="stop-color" dur="6s" values="#ffc371;#24c6dc;#9b5cff;#ff5f6d;#ffc371" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>

  <!-- soft glowing blobs -->
  <g filter="url(#f1)" opacity="0.12">
    <circle cx="200" cy="70" r="220" fill="url(#grad)"/>
    <circle cx="1000" cy="50" r="360" fill="url(#grad)"/>
  </g>

  <!-- main text -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="Inter, Roboto, Arial, sans-serif" font-weight="700" font-size="72"
        fill="url(#grad)" >
    Hello there, I'm Harb 👋
  </text>

  <!-- animated subtitle -->
  <text x="50%" y="76%" dominant-baseline="middle" text-anchor="middle"
        font-family="Inter, Roboto, Arial, sans-serif" font-size="32" fill="#cbd5e1" opacity="0.9">
    Aspiring Software Developer | Laravel &amp; React Enthusiast
  </text>
</svg>
